; Ajustes de producción para la API.
memory_limit = 256M

; La galería acepta imágenes de hasta 8 MB (ver GalleryController).
upload_max_filesize = 12M
post_max_size = 16M

max_execution_time = 60
expose_php = Off

; OPcache: el código no cambia en caliente dentro del contenedor.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
