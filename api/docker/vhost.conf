# El puerto real lo inyecta el entrypoint a partir de $PORT (Render lo define).
<VirtualHost *:__PORT__>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Render termina TLS en su proxy: sin esto Laravel genera URLs http://
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    ErrorLog /dev/stderr
    # Se excluye /up del log de acceso: es el health check y corre cada pocos segundos.
    SetEnvIf Request_URI "^/up$" no_log
    CustomLog /dev/stdout combined env=!no_log
</VirtualHost>
