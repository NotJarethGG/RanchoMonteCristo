<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Rancho Montecristo | Alquiler para eventos en Nicoya</title>
    <meta
      name="description"
      content="Alquilá el Rancho Montecristo completo en Nicoya, Guanacaste: cumpleaños, bodas, reuniones familiares y eventos de empresa. Rancho techado, áreas verdes y parqueo privado."
    />
    <link rel="canonical" href="%SITE_URL%/" />
    <!-- Versión en inglés en /en (vite.config.ts genera su HTML). -->
    <link rel="alternate" hreflang="es" href="%SITE_URL%/" />
    <link rel="alternate" hreflang="en" href="%SITE_URL%/en" />
    <link rel="alternate" hreflang="x-default" href="%SITE_URL%/" />
    <meta name="theme-color" content="#1F2D23" />
    <link rel="icon" type="image/png" sizes="64x64" href="/marca/favicon.png" />
    <link rel="apple-touch-icon" href="/marca/apple-touch-icon.png" />

    <!-- Tarjeta al compartir en WhatsApp, Facebook, X, etc. Los rastreadores
         de redes no ejecutan JavaScript: todo tiene que estar en el HTML. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rancho Montecristo" />
    <meta property="og:locale" content="es_CR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Rancho Montecristo · Alquiler para eventos en Nicoya" />
    <meta
      property="og:description"
      content="Un rancho entero, solo para tu gente. Alquiler del rancho completo para eventos en Nicoya, Guanacaste."
    />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de Rancho Montecristo: el Cristo sobre el cerro" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rancho Montecristo · Alquiler para eventos en Nicoya" />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />

    <!-- Conexiones anticipadas: la foto principal viene de Cloudinary y los
         datos de la API. Abrir antes el TLS le ahorra ida y vuelta al LCP. -->
    <!-- Sin crossorigin: las <img> se piden sin CORS, y una conexión abierta
         en modo CORS no se reutilizaría para ellas. -->
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Rokkitt (títulos), Chivo (texto) y Chivo Mono (datos). ~72 KB en
         total para el subconjunto latino. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Rokkitt:wght@400..800&family=Chivo:wght@400..600&family=Chivo+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">
        Rancho Montecristo — alquiler para eventos en Nicoya, Guanacaste. Este sitio necesita
        JavaScript para mostrar la disponibilidad y el formulario de reserva.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
